name: kvssink checks

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        run-config:
          - os: Ubuntu 22.04
            image: public.ecr.aws/ubuntu/ubuntu:22.04_stable
#          - os: Ubuntu 20.04
#            image: public.ecr.aws/ubuntu/ubuntu:20.04_stable
      fail-fast: false

    env:
      DEBIAN_FRONTEND: noninteractive

    name: kvssink unit tests on ${{ matrix.run-config.os }}
    container: ${{ matrix.run-config.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y automake m4 build-essential cmake git \
            gstreamer1.0-plugins-base-apps gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly \
            gstreamer1.0-tools \
            libcurl4-openssl-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev liblog4cplus-dev \
            libssl-dev pkg-config valgrind

      - name: Setup build directory
        run: |
          mkdir -p build
          cd build

      - name: Build kvssink unit tests
        working-directory: ./build
        run: |
          cmake .. -DBUILD_GSTREAMER_PLUGIN=ON -DBUILD_TEST=ON -DCMAKE_BUILD_TYPE=Debug -DALIGNED_MEMORY_MODEL=ON
          make -j$(nproc)

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ secrets.AWS_ROLE_SESSION_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-duration-seconds: 900

      - name: Run the unit tests
        working-directory: ./build
        run: |
          export GST_PLUGIN_PATH=`pwd`
          GST_DEBUG=4 ./tst/gstkvsplugintest

#      - name: Run the unit tests with valgrind
#        working-directory: ./build
#        run: |
#          export GST_PLUGIN_PATH=`pwd`
#          valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes \
#            --verbose --log-file=valgrind-out.txt ./tst/gstkvsplugintest
#
#          if grep -q "All heap blocks were freed -- no leaks are possible" valgrind-out.txt; then
#            echo "No memory leaks detected"
#          else
#            echo "Memory leaks detected. Review the valgrind output:"
#            cat valgrind-out.txt
#            exit 1
#          fi

  mac-debug-dump-dir:
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        BUILD_STATIC:
          - ON
          - OFF
      fail-fast: false

    env:
      AWS_KVS_LOG_LEVEL: 1
      STREAM_NAME: cpp-kvssink-debug-dump-dir-macos-latest-${{ matrix.BUILD_STATIC }}
      GST_PLUGIN_PATH: ${{ github.workspace }}/build
      KVS_DEBUG_DUMP_DATA_FILE_DIR: ${{ github.workspace }}/build/debug_output

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install gstreamer log4cplus mkvtoolnix

      - name: Build kvssink
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_GSTREAMER_PLUGIN=ON -DBUILD_DEPENDENCIES=OFF -DBUILD_STATIC=${{ matrix.BUILD_STATIC }}
          make -j$(nproc)

      - name: Verify static build
        if: ${{ matrix.BUILD_STATIC == 'ON' }}
        working-directory: build
        run: |
          otool -L libgstkvssink.dylib
          if otool -L libgstkvssink.dylib | grep -E 'libKinesisVideoProducer|libcproducer|libkvspic'; then
            echo "❌ Static build verification failed: KVS libraries are dynamically linked"
            exit 1
          fi
          echo "✅ Static build verified: No KVS dynamic libraries found"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ secrets.AWS_ROLE_SESSION_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-duration-seconds: 900

      - name: Run kvssink with dump dir
        working-directory: ./build
        run: |
          mkdir -p debug_output
          gst-launch-1.0 videotestsrc is-live=true num-buffers=450 \
            ! video/x-raw,framerate=30/1,width=640,height=480 \
            ! videoconvert ! x264enc tune=zerolatency key-int-max=45 \
            ! h264parse \
            ! kvssink stream-name="$STREAM_NAME"

      - name: Verify MKV dump
        working-directory: ./build/debug_output
        run: |
          mkvfiles=(*.mkv)
          if [ ${#mkvfiles[@]} -eq 0 ]; then
            echo "No MKV files found in debug_output"
            exit 1
          fi

          for file in "${mkvfiles[@]}"; do
            echo "Verifying $file with mkvinfo (verbose and hexdump):"
            mkvinfo -v -X "$file"
          done

  linux-debug-dump-dir:
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        run-config:
          - os: Ubuntu-22.04
            image: public.ecr.aws/ubuntu/ubuntu:22.04_stable
          - os: Ubuntu-20.04
            image: public.ecr.aws/ubuntu/ubuntu:20.04_stable
        BUILD_STATIC:
          - ON
          - OFF
      fail-fast: false

    runs-on: ubuntu-latest
    container: ${{ matrix.run-config.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
      STREAM_NAME: cpp-kvssink-debug-dump-dir-${{ matrix.run-config.os }}-${{ matrix.BUILD_STATIC }}
      GST_PLUGIN_PATH: ${{ github.workspace }}/build
      KVS_DEBUG_DUMP_DATA_FILE_DIR: ${{ github.workspace }}/build/debug_output

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y automake build-essential cmake git \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-base-apps \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly gstreamer1.0-tools \
            libcurl4-openssl-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev liblog4cplus-dev \
            libssl-dev pkg-config mkvtoolnix

      - name: Setup build directory
        run: |
          mkdir -p build
          cd build

      - name: Build kvssink
        working-directory: ./build
        run: |
          cmake .. -DBUILD_GSTREAMER_PLUGIN=ON -DCMAKE_BUILD_TYPE=Debug -DALIGNED_MEMORY_MODEL=ON -DBUILD_DEPENDENCIES=OFF -DBUILD_STATIC=${{ matrix.BUILD_STATIC }}
          make -j$(nproc)

      - name: Verify static build
        if: ${{ matrix.BUILD_STATIC == 'ON' }}
        working-directory: ./build
        run: |
          ldd libgstkvssink.so
          if ldd libgstkvssink.so | grep -E 'libKinesisVideoProducer|libcproducer|libkvspic'; then
            echo "❌ Static build verification failed: KVS libraries are dynamically linked"
            exit 1
          fi
          echo "✅ Static build verified: No KVS dynamic libraries found"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ secrets.AWS_ROLE_SESSION_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-duration-seconds: 900

      - name: Run kvssink with dump dir
        working-directory: ./build
        run: |
          mkdir -p debug_output
          gst-launch-1.0 videotestsrc is-live=true num-buffers=450 \
            ! video/x-raw,framerate=30/1,width=640,height=480 \
            ! videoconvert ! x264enc tune=zerolatency key-int-max=45 \
            ! h264parse \
            ! kvssink stream-name="$STREAM_NAME"

      - name: Verify MKV dump
        working-directory: ./build/debug_output
        run: |
          mkvfiles=(*.mkv)
          if [ ${#mkvfiles[@]} -eq 0 ]; then
            echo "No MKV files found in debug_output"
            exit 1
          fi

          for file in "${mkvfiles[@]}"; do
            echo "Verifying $file with mkvinfo (verbose and hexdump):"
            mkvinfo -v -X "$file"
          done
        shell: bash

  linux-aws-lc-e2e:
    # End-to-end kvssink streaming over the AWS-LC backend against the live
    # service, gated on TLS key exchange evidence. The allowlist is
    # rollout-tolerant: at the time of writing the KVS control plane negotiates
    # hybrid X25519MLKEM768 while the PutMedia hosts negotiate X25519, and a
    # service-side rollout step must not break unrelated pull requests. Every
    # connection must still log an allowlisted group with the AWS-LC backend -
    # anything else (classical fallback to an unexpected group, an OpenSSL
    # backend string, missing evidence lines) fails the job.
    #
    # The stream also runs with the system libssl.so.3/libcrypto.so.3 preloaded,
    # i.e. first in the process's global lookup scope, which is what a GStreamer
    # host using the system TLS stack looks like. Real AWS-LC handshakes then
    # resolve every lazily bound crypto call: if the plugin's AWS-LC symbols were
    # interposable (no --exclude-libs,ALL), those calls would bind to OpenSSL and
    # mix two incompatible implementations in one handshake, which is expected
    # to fail the handshake or crash the process. This is the runtime half of the
    # guard whose static half (check_symbol_clash.sh) runs in ci.yml
    # ubuntu-gcc-aws-lc.
    #
    # kvssink takes its log level from the log4cplus configuration
    # (../kvs_log_configuration relative to build/, DEBUG), not from
    # AWS_KVS_LOG_LEVEL, so the log can carry request details and hosts. It goes
    # to a file that is never printed or uploaded; only the TLS evidence and
    # error lines are echoed, with hosts redacted.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
    env:
      AWS_KVS_LOG_LEVEL: 2
      STREAM_NAME: cpp-kvssink-aws-lc-e2e
      GST_PLUGIN_PATH: ${{ github.workspace }}/build
      KVS_DEBUG_DUMP_DATA_FILE_DIR: ${{ github.workspace }}/build/debug_output
      ALLOWED_GROUPS: 'X25519MLKEM768|X25519'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone producer-c with the AWS-LC backend (CI-only pin override)
        uses: actions/checkout@v4
        with:
          repository: awslabs/amazon-kinesis-video-streams-producer-c
          ref: ${{ vars.KVSC_AWS_LC_REF || '844a0626ae17f84d3d54757335398e5e26beddb0' }}
          path: kvsc-aws-lc

      - name: Install dependencies
        run: |
          sudo apt clean && sudo apt update
          sudo apt install -y libunwind-dev
          sudo apt-get install -y libcurl4-openssl-dev liblog4cplus-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base-apps gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly \
            gstreamer1.0-tools mkvtoolnix

      - name: Build kvssink
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_GSTREAMER_PLUGIN=ON -DBUILD_STATIC=ON \
            -DUSE_OPENSSL=OFF -DUSE_AWS_LC=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLOCAL_KVSC_PATH="$GITHUB_WORKSPACE/kvsc-aws-lc"
          make -j$(nproc)

      - name: Verify crypto backend is AWS-LC
        run: |
          ./tst/scripts/check_crypto_backend.sh aws-lc ./build ./open-source/local/lib

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ secrets.AWS_ROLE_SESSION_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-duration-seconds: 900

      - name: Run kvssink against the live service with the system OpenSSL preloaded
        working-directory: ./build
        run: |
          mkdir -p debug_output
          system_ssl=$(ldconfig -p | awk '/libssl\.so\.3 /{print $NF; exit}')
          system_crypto=$(ldconfig -p | awk '/libcrypto\.so\.3 /{print $NF; exit}')
          if [ -z "$system_ssl" ] || [ -z "$system_crypto" ]; then
            echo "System libssl.so.3/libcrypto.so.3 not found; the interposition check would be vacuous"
            exit 1
          fi
          export LD_PRELOAD="$system_ssl:$system_crypto"
          echo "LD_PRELOAD=$LD_PRELOAD"
          # Positive control: the preload is really in the process's link map.
          ldd "$(command -v gst-launch-1.0)" | grep -E 'lib(ssl|crypto)\.so\.3'
          test "$(ldd "$(command -v gst-launch-1.0)" | grep -cE 'lib(ssl|crypto)\.so\.3')" -ge 2
          rc=0
          gst-launch-1.0 videotestsrc is-live=true num-buffers=450 \
            ! video/x-raw,framerate=30/1,width=640,height=480 \
            ! videoconvert ! x264enc tune=zerolatency key-int-max=45 \
            ! h264parse \
            ! kvssink stream-name="$STREAM_NAME" > kvssink-e2e.log 2>&1 || rc=$?
          unset LD_PRELOAD
          echo "gst-launch-1.0 exit code: $rc"
          # Evidence and errors only, with any URL or KVS host name redacted.
          grep -E 'TLS negotiated:|ERROR' kvssink-e2e.log | tail -n 50 \
            | sed -E 's#https?://[^ ]+#<url>#g; s#[A-Za-z0-9.-]+\.amazonaws\.com#<host>#g' || true
          exit "$rc"

      - name: Verify MKV dump
        working-directory: ./build/debug_output
        run: |
          shopt -s nullglob
          mkvfiles=(*.mkv)
          if [ ${#mkvfiles[@]} -eq 0 ]; then
            echo "No MKV files found in debug_output"
            exit 1
          fi
          for file in "${mkvfiles[@]}"; do
            mkvinfo -v "$file" > /dev/null && echo "$file OK"
          done

      - name: Verify TLS key exchange evidence against the allowlist
        working-directory: ./build
        run: |
          set -e
          echo "Allowlisted groups: $ALLOWED_GROUPS"
          if ! test -s kvssink-e2e.log; then
            echo "kvssink-e2e.log is missing or empty: no TLS evidence to check"
            exit 1
          fi
          # Every connection logs its negotiated group; the backend must be AWS-LC.
          tls_lines=$(grep -c 'TLS negotiated:.*keyExchange=.*AWS-LC' kvssink-e2e.log || true)
          tls_lines=${tls_lines:-0}
          echo "TLS evidence lines: $tls_lines"
          # describeStream + getDataEndpoint (control plane) plus the PutMedia
          # data-plane connection: both producer-c call sites must have fired.
          if [ "$tls_lines" -lt 3 ]; then
            echo "Expected at least 3 'TLS negotiated' lines (control plane x2 + PutMedia), got $tls_lines"
            exit 1
          fi
          # No line may carry a group outside the allowlist.
          offlist=$(grep 'TLS negotiated:' kvssink-e2e.log | grep -vE "keyExchange=($ALLOWED_GROUPS)( |$)" || true)
          if [ -n "$offlist" ]; then
            echo "TLS connections negotiated a group outside the allowlist:"
            echo "$offlist"
            exit 1
          fi
          echo "All $tls_lines TLS connections negotiated an allowlisted group over AWS-LC"

  windows-debug-dump-dir:
    runs-on: windows-2022
    env:
      AWS_KVS_LOG_LEVEL: 1
      STREAM_NAME: cpp-kvssink-debug-dump-dir-windows-2022
      GST_PLUGIN_PATH: D:\producer\build\
      KVS_DEBUG_DUMP_DATA_FILE_DIR: D:\producer\build\debug_output
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Move repository
        run: |
          mkdir D:\producer
          Move-Item -Path "$env:GITHUB_WORKSPACE\*" -Destination "D:\producer"
      - name: Install dependencies
        run: |
          choco install nasm strawberryperl mkvtoolnix
          choco install gstreamer --version=1.22.12
          choco install gstreamer-devel --version=1.22.12
      - name: Build repository
        run: |
          $env:Path += ';C:\Strawberry\perl\site\bin;C:\Strawberry\perl\bin;C:\Strawberry\c\bin;C:\Program Files\NASM;D:\producer\open-source\local\lib;D:\producer\open-source\local\bin'
          git config --system core.longpaths true
          cd D:\producer
          dir
          .github\build_windows.bat
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ secrets.AWS_ROLE_SESSION_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-duration-seconds: 900
      - name: Run kvssink with dump dir
        working-directory: D:\producer\build\
        run: |
          $env:Path += ';C:\Strawberry\perl\site\bin;C:\Strawberry\perl\bin;C:\Strawberry\c\bin;C:\Program Files\NASM;D:\producer\open-source\local\lib;D:\producer\open-source\local\bin;D:\gstreamer\1.0\msvc_x86_64\bin'

          # Create the debug directory (equivalent to mkdir -p)
          New-Item -ItemType Directory -Path "D:\producer\build\debug_output" -Force

          # Stream for 15 seconds (450 frames @ 30 fps)
          gst-launch-1.0.exe videotestsrc is-live=true num-buffers=450 ! video/x-raw,framerate=30/1,width=640,height=480 ! videoconvert ! x264enc tune=zerolatency key-int-max=45 ! h264parse ! kvssink stream-name="$env:STREAM_NAME"
      - name: Verify MKV dump
        working-directory: D:\producer\build
        run: |
          $env:Path += ";C:\Program Files\MKVToolNix"
          $mkvFiles = Get-ChildItem -Path "D:\producer\build\debug_output" -Filter *.mkv

          if ($mkvFiles.Count -eq 0) {
            Write-Error "No MKV files found in D:\producer\build\debug_output"
            exit 1
          }

          # Run mkvinfo on each MKV file
          foreach ($file in $mkvFiles) {
            Write-Output "Verifying $($file.FullName) with mkvinfo (verbose and hexdump):"
            mkvinfo.exe -v -X "$($file.FullName)"
          }

  wsl-debug-dump-dir:
    runs-on: windows-2022
    env:
      AWS_KVS_LOG_LEVEL: 1
    strategy:
      matrix:
        image:
          - Ubuntu-22.04
          - Ubuntu-24.04
      fail-fast: false
    defaults:
      run:
        shell: wsl-bash {0}  # Automatically uses wsl-bash for each run step
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: Vampire/setup-wsl@v4
        with:
          distribution: ${{ matrix.image }}
          additional-packages: |
            automake
            build-essential
            cmake
            git
            gstreamer1.0-plugins-base
            gstreamer1.0-plugins-base-apps
            gstreamer1.0-plugins-bad
            gstreamer1.0-plugins-good
            gstreamer1.0-plugins-ugly
            gstreamer1.0-tools
            libcurl4-openssl-dev
            libgstreamer1.0-dev
            libgstreamer-plugins-base1.0-dev
            liblog4cplus-dev
            libssl-dev
            pkg-config
            mkvtoolnix
          use-cache: 'false' # Cache entry for Ubuntu 22.04 and 24.04 are the same (conflict)

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move repository in WSL
        run: |
          # Copy to ~/kvs-cpp-repo for simplicity
          # Note: Can't move due to no permissions
          REPO_NAME=$(basename ${{ github.repository }})
          DRIVE_LETTER=$(echo "${{ github.workspace }}" | sed -r 's/^([A-Za-z]):.*/\1/' | tr '[:upper:]' '[:lower:]')
          cp -r /mnt/$DRIVE_LETTER/a/$REPO_NAME/$REPO_NAME ~/kvs-cpp-repo

      - name: Build kvssink in WSL
        run: |
          mkdir -p ~/kvs-cpp-repo/build
          cd ~/kvs-cpp-repo/build
          cmake .. -DBUILD_GSTREAMER_PLUGIN=ON -DALIGNED_MEMORY_MODEL=ON -DBUILD_DEPENDENCIES=OFF
          make -j$(nproc)

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ secrets.AWS_ROLE_SESSION_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-duration-seconds: 900

      - name: Run kvssink with dump dir in WSL
        run: |
          mkdir -p ~/kvs-cpp-repo/build/debug_output
          export GST_PLUGIN_PATH=~/kvs-cpp-repo/build
          export KVS_DEBUG_DUMP_DATA_FILE_DIR=~/kvs-cpp-repo/build/debug_output

          set +e  # Disable exit on error for the timeout command
          # Note: `env.` syntax to reference credentials to have GitHub Actions inject
          # the secret values into these environment variables before the command runs,
          # since the WSL shell doesn't have access to GitHub's environment variables
          timeout --preserve-status --signal=SIGINT --kill-after=15s 30s \
            gst-launch-1.0 videotestsrc is-live=true num-buffers=450 \
              ! video/x-raw,framerate=30/1,width=640,height=480 \
              ! videoconvert ! x264enc tune=zerolatency key-int-max=45 \
              ! h264parse \
              ! kvssink stream-name='cpp-kvssink-ci-wsl-videotestsrc-${{ matrix.image }}' \
                  aws-region=${{ env.AWS_DEFAULT_REGION }} \
                  access-key=${{ env.AWS_ACCESS_KEY_ID }} \
                  secret-key=${{ env.AWS_SECRET_ACCESS_KEY }} \
                  session-token=${{ env.AWS_SESSION_TOKEN }}
          EXIT_CODE=$?
          set -e  # Re-enable exit on error

          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "gst-launch-1.0 exited with status: $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Verify MKV dump in WSL
        run: |
          cd ~/kvs-cpp-repo/build/debug_output
          mkvfiles=($(ls *.mkv 2>/dev/null))
          if [ ${#mkvfiles[@]} -eq 0 ]; then
            echo 'No MKV files found in debug_output'
            exit 1
          fi
          for file in "${mkvfiles[@]}"; do
            echo "Verifying $file with mkvinfo:"
            mkvinfo -v -X "$file"
          done

  valgrind-check:
    strategy:
      matrix:
        run-config:
          - os: Ubuntu-22.04
            image: public.ecr.aws/ubuntu/ubuntu:22.04_stable
          - os: Ubuntu-20.04
            image: public.ecr.aws/ubuntu/ubuntu:20.04_stable

        deps:
          - name: Deps-ON
            cmake_flags: -DBUILD_DEPENDENCIES=ON
#          - name: Deps-OFF
#            cmake_flags: -DBUILD_DEPENDENCIES=OFF

      fail-fast: false

    runs-on: ubuntu-latest
    container: ${{ matrix.run-config.image }}

    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read

    env:
      DEBIAN_FRONTEND: noninteractive
      STREAM_NAME: valgrind-test-stream-cpp-kvssink-${{ matrix.run-config.os }}-${{ matrix.deps.name }}
      GST_PLUGIN_PATH: ${{ github.workspace }}/build

    name: Valgrind ${{ matrix.run-config.os }} (${{ matrix.deps.name }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake pkg-config git \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-base-apps \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly gstreamer1.0-tools \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            valgrind

      - name: Install additional build dependencies
        if: ${{ matrix.deps.name == 'Deps-ON' }}
        run: |
          apt-get install -y m4

      - name: Install prebuilt-dependencies
        if: ${{ matrix.deps.name == 'Deps-OFF' }}
        run: |
          apt-get install -y libcurl4-openssl-dev liblog4cplus-dev libssl-dev

      - name: Setup build directory
        run: |
          mkdir -p build
          cd build

      - name: Build kvssink
        working-directory: ./build
        run: |
          cmake .. -DBUILD_GSTREAMER_PLUGIN=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DALIGNED_MEMORY_MODEL=ON ${{ matrix.deps.cmake_flags }}
          make -j$(nproc)

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ secrets.AWS_ROLE_SESSION_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-duration-seconds: 900

      - name: Verify kvssink works
        working-directory: ./build
        run: |
          # Run it once just to confirm          
          gst-launch-1.0 videotestsrc num-buffers=1 ! x264enc ! h264parse ! kvssink stream-name="$STREAM_NAME"

      - name: Run kvssink with valgrind
        working-directory: ./build
        run: |          
          mkdir -p valgrind_logs
          LOG_FILE="valgrind_logs/${{ matrix.sample-executable.name }}.log"

          echo "::group::Application logs for kvssink"
          valgrind --leak-check=full \
            --show-leak-kinds=definite \
            --track-origins=yes \
            --log-file="$LOG_FILE" \
            --suppressions="../.github/valgrind/glib.supp" \
            gst-launch-1.0 videotestsrc num-buffers=1 \
              ! x264enc \
              ! h264parse \
              ! kvssink stream-name="$STREAM_NAME" log-config="../.github/configs/no_logs_configuration"
          echo "::endgroup::"

          echo "========== Valgrind Output =========="
          cat "$LOG_FILE"
          echo "====================================="

          if grep -qE "definitely lost: [^0]" "$LOG_FILE" || grep -qE "indirectly lost: [^0]" "$LOG_FILE"; then
            echo "❌ Valgrind found something definitely or indirectly lost"
            exit 1
          fi

        shell: bash
